name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      runner:
        description: "Use this Mac or a GitHub-hosted macOS runner"
        type: choice
        options: ["sheng-build", "macos-26", "macos-26-intel"]
        default: "sheng-build"
      check_only:
        description: "Validate the runner, Rust, SDK and preserved seed without building images"
        type: boolean
        default: false
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.os }}-${{ inputs.init_data }}
  cancel-in-progress: true

jobs:
  check:
    if: inputs.check_only
    runs-on: ${{ inputs.runner == 'sheng-build' && fromJSON('["self-hosted","macOS","ARM64","sheng-build"]') || inputs.runner || 'macos-26' }}
    timeout-minutes: 10
    steps:
      - name: validate build host
        env:
          PLATFORM_SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ is required"'
          rustup_bin="$(brew --prefix rustup)/bin"
          export PATH="$rustup_bin:$PATH"
          cargo +1.98.0 --version
          rustc +1.98.0 --version
          xcodebuild -version
          xcodebuild -checkFirstLaunchStatus
          xcrun --sdk iphoneos --show-sdk-path
          printf 'fn main() { println!("Rust toolchain works"); }\n' > "$RUNNER_TEMP/host-check.rs"
          rustc +1.98.0 "$RUNNER_TEMP/host-check.rs" -o "$RUNNER_TEMP/host-check"
          "$RUNNER_TEMP/host-check"
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/ios-check.c"
          xcrun --sdk iphoneos clang -target arm64e-apple-ios27.0 -c "$RUNNER_TEMP/ios-check.c" -o "$RUNNER_TEMP/ios-check.o"
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          assert re.fullmatch(r'[0-9a-fA-F]{8}', os.environ['PLATFORM_SEED']), 'Missing platform seed secret'
          if os.environ.get('RUNNER_ENVIRONMENT') == 'self-hosted':
              path = pathlib.Path(os.environ['SHENG_DATA_SEED_PATH'])
              assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ['SHENG_DATA_SEED_SHA256'], 'Original Data seed mismatch'
              print('Original local Data seed verified')
          PY
  userdata:
    if: inputs.os == '27' && inputs.init_data && !inputs.check_only
    runs-on: ${{ inputs.runner == 'sheng-build' && fromJSON('["self-hosted","macOS","ARM64","sheng-build"]') || inputs.runner || 'macos-26' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          clean: ${{ inputs.runner != 'sheng-build' }}
      - uses: actions/checkout@v4
        with:
          repository: Murderd1/UniXNU
          ref: d4b4ae0b1b656331e9ea0dce8a65d29ac26c908f
          path: UniXNU
          clean: ${{ inputs.runner != 'sheng-build' }}
      - name: root image tools
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ is required"'
          python3 device/scripts/install-ipsw.py --output "$RUNNER_TEMP/unixnu-tools"
      - name: verify first-install builder
        run: python3 device/scripts/check-first-install-userdata.py
      - name: build authenticated first-install userdata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 device/scripts/build-first-install-userdata.py --unixnu UniXNU
      - uses: actions/upload-artifact@v4
        with:
          name: first-install-userdata-27
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-first-install.img
            UniXNU/out/sheng/*/*/userdata/first-install.json
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
  package:
    if: ${{ !inputs.check_only }}
    runs-on: ${{ inputs.runner == 'sheng-build' && fromJSON('["self-hosted","macOS","ARM64","sheng-build"]') || inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          clean: ${{ inputs.runner != 'sheng-build' }}
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Murderd1/UniXNU
          ref: d4b4ae0b1b656331e9ea0dce8a65d29ac26c908f # Tools and source pins verified by the complete local iPadOS 27 build
          path: UniXNU
          clean: ${{ inputs.runner != 'sheng-build' }}
          submodules: recursive
      - name: tools
        run: |
          brew_bin="$(brew --prefix)/bin"
          export PATH="$brew_bin:$PATH"
          brew install --formula python@3.13 dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup
          python_bin="$(brew --prefix python@3.13)/libexec/bin"
          export PATH="$python_bin:$PATH"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), "Python 3.13 is required"'
          python3 device/scripts/install-ipsw.py --output "$RUNNER_TEMP/unixnu-tools"
          llvm_bin="$(brew --prefix llvm)/bin"
          lld_bin="$(brew --prefix lld)/bin"
          bison_bin="$(brew --prefix bison)/bin"
          rustup_bin="$(brew --prefix rustup)/bin"
          # Match the local build: Apple clang stays ahead of the keg-only LLVM tools.
          export PATH="$python_bin:$rustup_bin:$bison_bin:$RUNNER_TEMP/unixnu-tools:$brew_bin:/usr/bin:/bin:/usr/sbin:/sbin:$llvm_bin:$lld_bin"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "$llvm_bin/$t" ] || [ -f "$lld_bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          command -v cargo >/dev/null || { echo 'missing tool: cargo (check brew --prefix rustup)/bin in PATH'; ok=0; }
          command -v rustc >/dev/null || { echo 'missing tool: rustc (check brew --prefix rustup)/bin in PATH'; ok=0; }
          cargo +1.98.0 --version || { echo 'Rust 1.98.0 cargo is not runnable'; ok=0; }
          rustc +1.98.0 --version || { echo 'Rust 1.98.0 rustc is not runnable'; ok=0; }
          xcodebuild -version >/dev/null 2>&1 || { echo 'Full Xcode is required; select it with xcode-select'; ok=0; }
          xcodebuild -checkFirstLaunchStatus >/dev/null 2>&1 || { echo 'Complete Xcode first launch before building'; ok=0; }
          xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1 || { echo 'iPhoneOS SDK is unavailable; install full Xcode'; ok=0; }
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: Wi-Fi firmware inputs
        run: |
          python3 device/scripts/fetch-wifi-firmware.py
          mkdir -p device/build
          python3 device/scripts/check-wifi-firmware.py
      - name: Wi-Fi userspace preflight
        if: inputs.os == '27'
        run: python3 device/scripts/build-wifi-userspace.py device/build/wifi-preflight ios27
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38
          path: uefi-sheng
          clean: ${{ inputs.runner != 'sheng-build' }}
          submodules: recursive
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          local_seed = os.environ.get('SHENG_DATA_SEED_PATH', '')
          if local_seed and os.environ.get('RUNNER_ENVIRONMENT') == 'self-hosted':
              data = pathlib.Path(local_seed).read_bytes()
              expected = os.environ.get('SHENG_DATA_SEED_SHA256', '')
              if len(data) > 64 * 1024 * 1024 or len(expected) != 64 or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('Local original Data seed SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Cached seed differs from the local original installation backup')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}" -j 4
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            device/drivers/Ath12kWifi/out/wpa-ios/build.log
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
