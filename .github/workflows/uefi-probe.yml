name: UEFI probe

# Firmware bring-up; full reuses an audited package without rebuilding XNU.
on:
  push:
    branches: ["codex/uefi-probe"]
    paths:
      - ".github/workflows/uefi-probe.yml"
      - "scripts/build-uefi-probe.py"
      - "scripts/check-uefi-probe.py"
      - "scripts/check-uefi-kernel-probe.py"
      - "scripts/make-uefi-menu-volume.py"
      - "scripts/repack-sheng-full-trial.py"
      - "scripts/uefi_full_trial.py"
      - "scripts/patch-sheng-root-state.py"
      - "package/RootStateProbe.*"
      - "scripts/uefi_handoff_clean.py"
      - "scripts/check-uefi-handoff-clean.py"
      - "package/UefiProbe/**"
      - "package/UefiMenu/**"
      - "package/UefiMenuDisk/**"
      - "package/UefiKernelDisk/**"
      - "package/UefiKernelProbe/**"
      - "board.toml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Build host for the independent DEBUG UEFI probe"
        type: choice
        options: ["macos-26", "macos-26-intel", "sheng-build"]
        default: "macos-26"
      prepare_only:
        description: "Prepare isolated sources only; no stock import or firmware compilation"
        type: boolean
        default: false
      stage:
        description: "Firmware stage; full-resume boots the installed system with existing Data"
        type: choice
        options: ["full", "full-resume", "menu", "probe"]
        default: "menu"
      full_package_run:
        description: "Audited complete images-27 package run (full stage only)"
        type: string
        default: "43467452829"
      root_readonly_probe:
        description: "Read-only root manifest diagnosis using the existing full kernel (full stage only)"
        type: boolean
        default: false
      full_root_trial:
        description: "Explicit installed-root trial; exact baseline args, no probe, log=0/data-persist=0 (requires full + handoff code clean)"
        type: boolean
        default: false
      root_media_probe:
        description: "Explicit probe 12 media report; Data seed media may count (requires full + handoff code clean)"
        type: boolean
        default: false
      root_state_probe:
        description: "Explicit delayed startup-state diagnostic; log=0/data-persist=0 (requires full + handoff code clean)"
        type: boolean
        default: false
      root_data_init:
        description: "First install only: initialize Data overlay and continue boot, log=0/data-persist=2/data-reset=1 (requires full + handoff code clean)"
        type: boolean
        default: false
      handoff_code_clean:
        description: "Handoff code PoC clean (explicit full-stage root trial modes only)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: uefi-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ${{ inputs.runner == 'sheng-build' && fromJSON('["self-hosted","macOS","ARM64","sheng-build"]') || inputs.runner || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe-sources/device
          clean: ${{ inputs.runner != 'sheng-build' }}
          # No board/kernel/peripheral submodules are needed by this entry point.
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: d830d23b0d19c9322d906c21afeca1d6c54aeffe
          path: probe-sources/UniXNU
          clean: ${{ inputs.runner != 'sheng-build' }}
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38
          path: probe-sources/uefi-sheng
          clean: ${{ inputs.runner != 'sheng-build' }}
          submodules: false
      - name: firmware tools
        run: |
          formulas="python@3.13 dtc llvm lld cmake mtools"
          brew install --formula $formulas || { brew link --overwrite python@3.13; brew install --formula $formulas; }
          python_bin="$(brew --prefix python@3.13)/libexec/bin"
          llvm_bin="$(brew --prefix llvm)/bin"
          lld_bin="$(brew --prefix lld)/bin"
          export PATH="$python_bin:$(brew --prefix)/bin:/usr/bin:/bin:/usr/sbin:/sbin:$llvm_bin:$lld_bin"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          for tool in clang make git cmake dtc fdtget fdtput llvm-objcopy llvm-nm ld.lld lld-link llvm-lib llvm-rc mformat mcopy mdir; do
            command -v "$tool" >/dev/null || { echo "Missing firmware tool: $tool" >&2; exit 1; }
          done
      - name: offline probe contract checks
        run: python3 probe-sources/device/scripts/build-uefi-probe.py --self-test
      - name: validate explicit root trial inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          PROBE_STAGE: ${{ inputs.stage }}
          ROOT_READONLY_PROBE: ${{ inputs.root_readonly_probe }}
          FULL_ROOT_TRIAL: ${{ inputs.full_root_trial }}
          ROOT_MEDIA_PROBE: ${{ inputs.root_media_probe }}
          ROOT_STATE_PROBE: ${{ inputs.root_state_probe }}
          ROOT_DATA_INIT: ${{ inputs.root_data_init }}
          ROOT_DATA_RESUME: ${{ inputs.stage == 'full-resume' }}
          HANDOFF_CODE_CLEAN: ${{ inputs.handoff_code_clean }}
        run: |
          [ "$PROBE_STAGE" != full-resume ] || PROBE_STAGE=full
          modes=0
          [ "$ROOT_READONLY_PROBE" != true ] || modes=$((modes + 1))
          [ "$FULL_ROOT_TRIAL" != true ] || modes=$((modes + 1))
          [ "$ROOT_MEDIA_PROBE" != true ] || modes=$((modes + 1))
          [ "$ROOT_STATE_PROBE" != true ] || modes=$((modes + 1))
          [ "$ROOT_DATA_INIT" != true ] || modes=$((modes + 1))
          [ "$ROOT_DATA_RESUME" != true ] || modes=$((modes + 1))
          test "$modes" -le 1
          if [ "$modes" -gt 0 ]; then test "$PROBE_STAGE" = full; fi
          if [ "$FULL_ROOT_TRIAL" = true ] || [ "$ROOT_MEDIA_PROBE" = true ] || [ "$ROOT_STATE_PROBE" = true ] || [ "$ROOT_DATA_INIT" = true ] || [ "$ROOT_DATA_RESUME" = true ]; then
            test "$HANDOFF_CODE_CLEAN" = true
          fi
          if [ "$HANDOFF_CODE_CLEAN" = true ]; then
            test "$PROBE_STAGE" = full
            test "$modes" -eq 1
          fi
      - uses: actions/checkout@v4
        if: inputs.stage == 'full' || inputs.stage == 'full-resume' || github.event_name == 'push'
        with:
          repository: microsoft/mu_basecore
          ref: cfb93724a06ff86ff5ba971413368a7809ee42a5
          path: probe-host-headers
          submodules: false
      - name: full-kernel probe host checks before large downloads
        if: inputs.stage == 'full' || inputs.stage == 'full-resume' || github.event_name == 'push'
        run: |
          python3 probe-sources/device/scripts/check-uefi-kernel-probe.py --edk2 probe-host-headers --unixnu probe-sources/UniXNU --cc cc --aarch64-cc clang
      - name: retrieve audited complete package
        if: inputs.stage == 'full' || inputs.stage == 'full-resume' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_PACKAGE_RUN: ${{ inputs.full_package_run || '43467452829' }}
          ROOT_STATE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.root_state_probe }}
          ROOT_DATA_INIT: ${{ github.event_name == 'workflow_dispatch' && inputs.root_data_init }}
          ROOT_DATA_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'full-resume' }}
        run: |
          test "$FULL_PACKAGE_RUN" = 43467452829
          if [ "$ROOT_STATE_PROBE" = true ] || [ "$ROOT_DATA_INIT" = true ] || [ "$ROOT_DATA_RESUME" = true ]; then
            gh run download 43616475669 --repo "$GITHUB_REPOSITORY" --name uefi-probe-43616475669-1 --dir full-media-baseline
          else
            gh run download "$FULL_PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --name images-27 --dir full-package
          fi
      - name: build isolated DEBUG probe
        env:
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          PROBE_STAGE: ${{ inputs.stage || 'full' }}
          ROOT_READONLY_PROBE: ${{ github.event_name == 'push' || inputs.root_readonly_probe }}
          FULL_ROOT_TRIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_root_trial }}
          ROOT_MEDIA_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.root_media_probe }}
          ROOT_STATE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.root_state_probe }}
          ROOT_DATA_INIT: ${{ github.event_name == 'workflow_dispatch' && inputs.root_data_init }}
          ROOT_DATA_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'full-resume' }}
          HANDOFF_CODE_CLEAN: ${{ github.event_name == 'push' || inputs.handoff_code_clean }}
        run: |
          [ "$PROBE_STAGE" != full-resume ] || PROBE_STAGE=full
          args=(--unixnu probe-sources/UniXNU --uefi probe-sources/uefi-sheng --stage "$PROBE_STAGE" --output "probe-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "$PROBE_STAGE" = full ]; then
            if [ "$ROOT_STATE_PROBE" = true ] || [ "$ROOT_DATA_INIT" = true ] || [ "$ROOT_DATA_RESUME" = true ]; then
              args+=(--full-media-baseline full-media-baseline)
            else
              args+=(--full-package full-package/ipados-27.0.1-24A446/sheng_ipados27)
            fi
          fi
          [ "$ROOT_READONLY_PROBE" != true ] || args+=(--root-readonly-probe)
          [ "$FULL_ROOT_TRIAL" != true ] || args+=(--full-root-trial)
          [ "$ROOT_MEDIA_PROBE" != true ] || args+=(--root-media-probe)
          [ "$ROOT_STATE_PROBE" != true ] || args+=(--root-state-probe)
          [ "$ROOT_DATA_INIT" != true ] || args+=(--root-data-init)
          [ "$ROOT_DATA_RESUME" != true ] || args+=(--root-data-resume)
          [ "$HANDOFF_CODE_CLEAN" != true ] || args+=(--handoff-code-clean)
          [ "$PREPARE_ONLY" != true ] || args+=(--prepare-only)
          python3 probe-sources/device/scripts/build-uefi-probe.py "${args[@]}" -j 4
      - name: preserve probe outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-probe-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          # Do not upload work/ (vendor modules and source checkouts).
          # The full FAT is already inside boot.img; extract its ramdisk to
          # check the full-volume.img hash without uploading it twice.
          path: |
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/boot.img
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/SILICIUM_UEFI.fd
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/boot.json
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/checkpoints.json
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/stock-inputs.json
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/fv-check.json
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/menu-volume.img
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/menu-volume.json
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/full-trial-inputs.json
            probe-output-${{ github.run_id }}-${{ github.run_attempt }}/logs/**
